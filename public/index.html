<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sure Nichith — DevOps · AIOps · DevSecOps Engineer</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="splash">
        <div class="splash__bg">
            <div class="blob blob--1"></div>
            <div class="blob blob--2"></div>
            <div class="blob blob--3"></div>
        </div>

        <div class="splash__content">
            <div class="splash__img-outer">
                <div class="splash__img-wrap">
                    <img src="img/img.png" alt="Sure Nichith" class="splash__photo">
                </div>
            </div>

            <div class="splash__text">
                <p class="splash__greeting">Hello, I'm</p>
                <h1 class="splash__name">Sure Nichith</h1>
                <p class="splash__role">
                    <span class="splash__role-prefix">A </span><span id="role-text">DevOps Engineer</span>
                </p>
                <p class="splash__bio">
                    Production-grade cloud infrastructure across Azure, GCP &amp; on-prem.
                    3 published patents &middot; 10+ research projects in AI automation, cloud security, and infrastructure optimization.
                </p>

                <a href="portfolio.html" class="splash__cta">
                    <span>Explore Portfolio</span>
                    <i class="bx bx-right-arrow-alt"></i>
                </a>

                <div class="splash__social">
                    <a href="https://www.linkedin.com/in/sure-nichith-b492bb24a/" target="_blank" rel="noopener" class="splash__social-link" title="LinkedIn">
                        <i class="bx bxl-linkedin"></i>
                    </a>
                    <a href="https://github.com/Jstnichu" target="_blank" rel="noopener" class="splash__social-link" title="GitHub">
                        <i class="bx bxl-github"></i>
                    </a>
                    <a href="#" class="splash__social-link" title="Instagram">
                        <i class="bx bxl-instagram"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const roles = ['DevOps Engineer', 'AIOps Engineer', 'DevSecOps Engineer', 'Cloud Architect', 'Infrastructure Automation Specialist','Python Developer'];
        let index = 0;
        const el = document.getElementById('role-text');

        function cycleRole() {
            el.classList.add('fade-out');
            setTimeout(() => {
                index = (index + 1) % roles.length;
                el.textContent = roles[index];
                el.classList.remove('fade-out');
            }, 300);
        }
        setInterval(cycleRole, 2200);
    </script>
</body>
</html>
